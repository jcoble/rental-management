name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  # Connection string the API/Engine/tests use to reach the CI Postgres service.
  ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=rentalcommand_ci;Username=postgres;Password=postgres"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentalcommand_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache restored NuGet packages keyed on the project/lock files so restore
      # only re-downloads when a dependency actually changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore RentalCommand.sln

      - name: Build
        run: dotnet build RentalCommand.sln --no-restore --configuration Release

      - name: Run tests
        run: >-
          dotnet test RentalCommand.sln
          --no-build
          --configuration Release
          --verbosity normal
