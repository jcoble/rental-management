name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  # NOTE: the test connection string lives on the "Run tests" step (it needs the
  # service's ephemeral host port, and the job.services context isn't available
  # in workflow-level env).

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentalcommand_ci
        # Ephemeral host port — a fixed 5432:5432 collides with the OTHER repo's
        # test service when both run on the shared build box.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          # Self-hosted runner: install into the runner's own tool cache
          # (user-owned, persists across runs) instead of /usr/share/dotnet,
          # which the runner user can't write.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache restored NuGet packages keyed on the project/lock files so restore
      # only re-downloads when a dependency actually changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore RentalCommand.sln

      - name: Build
        run: dotnet build RentalCommand.sln --no-restore --configuration Release

      - name: Run tests
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=rentalcommand_ci;Username=postgres;Password=postgres"
        run: >-
          dotnet test RentalCommand.sln
          --no-build
          --configuration Release
          --verbosity normal

  mobile:
    name: Mobile (Flutter)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug
