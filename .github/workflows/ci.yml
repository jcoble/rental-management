name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Auto-cancel superseded CI runs for the same ref so rapid pushes (and batch
# merges) don't pile a queue of stale runs onto the single self-hosted runner
# and starve the deploy. Only the latest commit for a ref keeps its CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  # NOTE: the test connection string lives on the "Run tests" step (it needs the
  # service's ephemeral host port, and the job.services context isn't available
  # in workflow-level env).

jobs:
  build-and-test:
    name: Build & Test
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentalcommand_ci
        # Ephemeral host port — a fixed 5432:5432 collides with the OTHER repo's
        # test service when both run on the shared build box.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          # Self-hosted runner: install into the runner's own tool cache
          # (user-owned, persists across runs) instead of /usr/share/dotnet,
          # which the runner user can't write.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache restored NuGet packages keyed on the project/lock files so restore
      # only re-downloads when a dependency actually changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore RentalCommand.sln

      - name: Build
        run: dotnet build RentalCommand.sln --no-restore --configuration Release

      - name: Run tests
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=rentalcommand_ci;Username=postgres;Password=postgres"
        run: >-
          dotnet test RentalCommand.sln
          --no-build
          --configuration Release
          --verbosity normal

  mobile:
    name: Mobile (Flutter)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # subosito/flutter-action's setup.sh hard-requires `jq`, and the self-hosted
      # runner doesn't ship it — so the whole Mobile job was dying at "Setup Flutter"
      # ("jq not found") before flutter analyze/build ever ran. Install a static jq
      # into a user-writable dir (no sudo) and add it to PATH for later steps.
      - name: Ensure jq (subosito/flutter-action dependency)
        working-directory: ${{ github.workspace }}
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present: $(jq --version)"
          else
            echo "jq missing on runner — installing static binary (no sudo)"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o "$HOME/.local/bin/jq"
            chmod +x "$HOME/.local/bin/jq"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/jq" --version
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # NOTE: no `flutter build apk` here. The self-hosted runner has no Android SDK
      # ("No Android SDK found / set ANDROID_HOME"), and installing the full Android
      # toolchain + Gradle on the shared, RAM-constrained build box isn't worth it —
      # the deployable APK is built on the dev machine for on-device testing. `flutter
      # analyze` is the mobile CI gate (catches Dart/compile errors). If APK CI builds
      # are wanted later, provision the Android SDK on the runner and re-add the step.
