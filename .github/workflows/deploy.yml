name: Deploy

# Production deploy for rc.coblesolutions.com.
#
# Triggers (DEPLOY IS NO LONGER AUTOMATIC ON MAIN PUSH — that made every merge a slow build):
#   • Push a version tag   ->  git tag v1.4 && git push --tags     (cut a release)
#   • Manual               ->  Actions ▸ Deploy ▸ Run workflow / `gh workflow run deploy.yml`
#                              (optionally paste a SHA/ref; deploys the chosen commit)
# Plain merges to main do nothing — deploy is a deliberate step run once per batch at the
# verify stage. See the CI/CD-redo task; pairs with CI moving to GitHub-hosted so the
# self-hosted box is deploy-only.
#
# Model: build api/engine/web on the self-hosted build box, push to GHCR, then the prod box
# only PULLS and restarts (it never compiles — see deploy/docker-compose.prod.yml).
# Migrations self-apply on boot under a shared Postgres advisory lock.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or ref to deploy (blank = the ref this run was launched from)"
        required: false
        default: ""

# Never let two prod deploys overlap; queue them instead of cancelling an in-flight one.
# Deploys are now explicit (tag/manual), so there's no auto-push pile-up to gate.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/jcoble/rentalcommand
  DEPLOY_DOMAIN: rc.coblesolutions.com
  # Per-runner docker config. Both repos' runners on the build box run as the
  # same user, so the default shared ~/.docker buildx store lets one repo's
  # setup-buildx post-cleanup stop the OTHER repo's active builder mid-build
  # (observed twice: "graceful_stop" buildkit deaths). This path lives under
  # this runner's _work dir, so builders/registry logins never cross repos.
  DOCKER_CONFIG: ${{ github.workspace }}/../.docker
  # Self-hosted runner: the github service user can't mkdir under setup-dotnet's default
  # (/usr/share/dotnet), so install to a runner-writable dir. The 10.0 SDK is pre-seeded
  # there (shared with the EdiPlatform runner on the same box/user), so setup-dotnet detects
  # it and skips the per-run download.
  DOTNET_INSTALL_DIR: '/home/github/.dotnet'

jobs:
  build-push:
    name: Build & push images (GHCR)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Compute image tag (git short sha)
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Keep the shared build box off 100% disk, which silently drops the self-hosted runner
      # offline mid-build (it can't even write a log line) -- happened 2026-06-21, 72/75G full.
      # Dangling volumes are pure waste on a build box (no app runs here) and were the biggest
      # creep, so ALWAYS clear them. Only sacrifice the warm image/layer cache when disk is
      # genuinely low, so normal builds keep their fast incremental cache.
      - name: Reclaim build-box disk
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4" free / "$2" ("$5" used)"}')"
          docker volume prune -f >/dev/null 2>&1 || true
          avail_kb=$(df -P / | awk 'NR==2{print $4}')
          if [ "${avail_kb:-0}" -lt 15000000 ]; then
            echo "low disk (<15G free) -- pruning old tagged images + build cache too"
            docker image prune -af --filter 'until=24h' >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
          fi
          echo "after:  $(df -h / | awk 'NR==2{print $4" free / "$2" ("$5" used)"}')"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Compile the solution ONCE on the runner, then publish Api + Engine from that warm
      # build (incremental, no recompile). This replaces the old per-image in-Docker compile
      # where Dockerfile.api and Dockerfile.engine each rebuilt Core/Data/Engine separately.
      # Published before the images are assembled; the images are runtime-only COPYs.
      - name: Restore, build & publish (.NET)
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet publish RentalCommand.Api/RentalCommand.Api.csproj -c Release --no-build -o publish/api /p:UseAppHost=false /p:ErrorOnDuplicatePublishOutputFiles=false
          dotnet publish RentalCommand.Engine/RentalCommand.Engine.csproj -c Release --no-build -o publish/engine /p:UseAppHost=false /p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain `docker build` on the persistent self-hosted daemon: its local layer cache
      # survives between runs, so buildx + the network-round-tripping type=gha cache are gone.
      # The .NET images are runtime-only and take a NARROW context (publish/<app>).
      - name: Build & push API
        run: |
          docker build -f Dockerfile.api \
            -t "${IMAGE_PREFIX}-api:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE_PREFIX}-api:latest" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            publish/api
          docker push "${IMAGE_PREFIX}-api:${{ steps.meta.outputs.tag }}"
          docker push "${IMAGE_PREFIX}-api:latest"

      - name: Build & push Engine
        run: |
          docker build -f Dockerfile.engine \
            -t "${IMAGE_PREFIX}-engine:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE_PREFIX}-engine:latest" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            publish/engine
          docker push "${IMAGE_PREFIX}-engine:${{ steps.meta.outputs.tag }}"
          docker push "${IMAGE_PREFIX}-engine:latest"

      # Web still builds in Docker (unchanged Dockerfile.web). VITE_API_URL MUST be /api/v1 —
      # the .NET API mounts every controller under /api/v1/* and the web client appends bare
      # paths. The new repo-root .dockerignore keeps this root context lean.
      - name: Build & push Web
        run: |
          docker build -f Dockerfile.web \
            -t "${IMAGE_PREFIX}-web:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE_PREFIX}-web:latest" \
            --build-arg VITE_API_URL=/api/v1 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .
          docker push "${IMAGE_PREFIX}-web:${{ steps.meta.outputs.tag }}"
          docker push "${IMAGE_PREFIX}-web:latest"

  deploy:
    name: Pull & restart on prod box
    needs: build-push
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Checkout (for the compose file)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose file to box
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rental-command/deploy/docker-compose.prod.yml"

      - name: Pull images & restart stack
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Pipe the GHCR token via stdin so it never lands in the box's process list. docker
          # login consumes it; the remaining commands run from the ssh command argument. TAG is a
          # hex git sha and ACTOR a GitHub username — both come from env (not interpolated in shell).
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             cd /opt/rental-command
             docker login ghcr.io -u '$ACTOR' --password-stdin
             grep -v '^IMAGE_TAG=' .env > .env.tmp 2>/dev/null || true
             echo 'IMAGE_TAG=$TAG' >> .env.tmp
             mv .env.tmp .env
             chmod 600 .env
             docker image prune -af >/dev/null 2>&1 || true   # free disk BEFORE pulling: clears old *tagged* builds (api:<sha> etc.) that pile up each deploy; the '-f' below only clears dangling, so the 38G box used to fill and the pull failed with 'no space left on device' (2026-06-18). Running images stay (in use) = 1-version rollback kept.
             docker compose -f deploy/docker-compose.prod.yml --env-file .env pull api engine web
             docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
             docker image prune -f >/dev/null 2>&1 || true
             docker logout ghcr.io >/dev/null 2>&1 || true
             echo \"deployed IMAGE_TAG=$TAG\""

      - name: Health check
        run: |
          echo "Waiting for https://${DEPLOY_DOMAIN}/health ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${DEPLOY_DOMAIN}/health" || true)
            if [ "$code" = "200" ]; then echo "healthy after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "::error::API did not become healthy at https://${DEPLOY_DOMAIN}/health"
          exit 1
