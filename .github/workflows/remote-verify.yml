name: Remote verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Pushed branch, tag, or commit SHA to verify"
        required: true
        type: string
      profile:
        description: "Verification depth"
        required: true
        default: standard
        type: choice
        options:
          - focused
          - standard
          - full
      test_filter:
        description: "Optional dotnet test filter (focused profile only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rental-command-azure-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, azure-build, rental-command]
    timeout-minutes: 120
    env:
      MSBUILDDISABLENODEREUSE: "1"
      ARTIFACT_DIR: ${{ runner.temp }}/rental-command-results-${{ github.run_id }}
    steps:
      - name: Validate requested ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^[A-Za-z0-9._/@:+-]+$ ]] || {
            echo "::error::Ref contains unsupported characters"
            exit 2
          }

      - name: Checkout exact requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: true
          fetch-depth: 1

      - name: Record resolved commit
        shell: bash
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          echo "Resolved ${{ inputs.ref }} to $resolved_sha"
          echo "### Rental Command remote verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested ref: \`${{ inputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact commit: \`$resolved_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: \`${{ inputs.profile }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run serialized verification
        shell: bash
        env:
          VERIFY_PROFILE: ${{ inputs.profile }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          # This path is intentionally shared with EdiPlatform. Repository-level
          # concurrency cannot prevent two different repositories from colliding.
          flock --wait 7200 /run/lock/azure-build-runner.lock \
            ./scripts/remote/verify.sh "$VERIFY_PROFILE" "$ARTIFACT_DIR" "$TEST_FILTER"

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-command-${{ inputs.profile }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Stop build servers
        if: always()
        shell: bash
        run: dotnet build-server shutdown || true
