<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maintenance photo — {{title}}</title>
<style>
  /* Stylized/captioned placeholder "phone photo" of a maintenance issue (real damage can't be
     synthesized; per Q4 decision these are captioned placeholders that exercise the photo-ingest
     path). The vision model reads the caption/label to draft the work order. */
  html,body{margin:0;padding:0;background:#111;}
  .stage{width:1200px;height:1600px;box-sizing:border-box;position:relative;overflow:hidden;
    background:linear-gradient(160deg,{{c1}} 0%,{{c2}} 55%,{{c3}} 100%);}
  .grain{position:absolute;inset:0;opacity:.10;
    background-image:radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.4px);background-size:5px 5px;}
  .subject{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate({{rot}}deg);
    width:520px;height:360px;border-radius:10px;background:{{sc1}};box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:Arial,sans-serif;}
  .subject .icon{font-size:120px;opacity:.9;line-height:1;}
  .vignette{position:absolute;inset:0;box-shadow:inset 0 0 240px rgba(0,0,0,.6);pointer-events:none;}
  .label{position:absolute;left:40px;bottom:40px;right:40px;background:rgba(0,0,0,.66);color:#fff;
    font-family:"Helvetica Neue",Arial,sans-serif;padding:22px 26px;border-radius:8px;backdrop-filter:blur(2px);}
  .label .t{font-size:34px;font-weight:800;margin-bottom:6px;}
  .label .d{font-size:22px;opacity:.92;line-height:1.4;}
  .stamp{position:absolute;right:34px;top:30px;color:#ffde59;font-family:"Courier New",monospace;font-size:26px;
    text-shadow:0 2px 4px rgba(0,0,0,.7);letter-spacing:1px;}
  .filter{position:absolute;inset:0;backdrop-filter:contrast(1.06);}
</style>
</head>
<body>
  <div class="stage">
    <div class="grain"></div>
    <div class="subject"><div class="icon">{{icon}}</div></div>
    <div class="vignette"></div>
    <div class="stamp">{{date}}</div>
    <div class="label">
      <div class="t">{{title}}</div>
      <div class="d">{{location}} &middot; reported by tenant<br>{{description}}</div>
    </div>
  </div>
</body>
</html>
