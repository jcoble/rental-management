<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check {{checkNumber}}</title>
<style>
  html,body{margin:0;padding:0;background:#22262c;}
  .stage{width:1200px;height:820px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:70px;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(255,255,255,.06), rgba(0,0,0,.4) 72%),
      linear-gradient(155deg,#3d424a 0%,#2a2e35 50%,#1f2329 100%);}
  .check{position:relative;width:940px;height:430px;padding:26px 32px;transform:rotate(-1.2deg);
    background-color:#e9f2f4;
    background-image:repeating-linear-gradient(0deg,rgba(20,60,80,.04) 0 2px,transparent 2px 6px),
      linear-gradient(115deg,#eef5f7 0%,#dfeef0 40%,#eaf3f5 100%);
    color:#12303a;box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.4);
    font-family:"Georgia",serif;filter:contrast(1.05) blur(.3px);}
  .check::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.12);}
  .top{display:flex;justify-content:space-between;}
  .payer{font-size:15px;line-height:1.35;}
  .payer .nm{font-size:18px;font-weight:800;letter-spacing:.3px;}
  .num{text-align:right;font-family:Arial;}
  .num .n{font-size:20px;font-weight:800;color:#8a1e2b;}
  .num .dt{margin-top:26px;border-bottom:1px solid #333;padding:0 8px 2px;}
  .payline{display:flex;align-items:flex-end;margin-top:34px;}
  .payline .lbl{font-size:12px;color:#333;width:120px;}
  .payline .nmv{flex:1;border-bottom:1px solid #333;font-size:19px;font-weight:700;padding:0 8px 3px;}
  .payline .box{margin-left:14px;border:2px solid #12303a;padding:6px 14px;font-size:20px;font-weight:800;font-family:Arial;}
  .words{margin-top:12px;border-bottom:1px solid #333;font-size:16px;font-style:italic;padding-bottom:3px;}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;}
  .memo{font-size:13px;}
  .memo .ln{border-bottom:1px solid #333;min-width:230px;display:inline-block;padding:0 6px;font-style:italic;}
  .sig{border-top:1px solid #333;width:250px;text-align:center;font-size:12px;padding-top:3px;font-style:italic;}
  .micr{margin-top:20px;font-family:"Courier New",monospace;font-size:18px;letter-spacing:2px;color:#222;}
  .bank{font-size:13px;color:#33555f;margin-top:6px;}
</style>
</head>
<body>
  <div class="stage"><div class="check">
    <div class="top">
      <div class="payer">
        <div class="nm">{{payerName}}</div>
        <div>{{payerAddress}}</div>
        <div class="bank">{{bankName}}</div>
      </div>
      <div class="num">
        <div class="n">No. {{checkNumber}}</div>
        <div class="dt">{{date}}</div>
      </div>
    </div>
    <div class="payline">
      <div class="lbl">Pay to the<br>order of</div>
      <div class="nmv">{{payee}}</div>
      <div class="box">$ {{amount}}</div>
    </div>
    <div class="words">{{amountWords}} dollars</div>
    <div class="bottom">
      <div class="memo">Memo <span class="ln">{{memo}}</span></div>
      <div class="sig">{{payerName}}</div>
    </div>
    <div class="micr">&#x2AFF;{{routing}}&#x2AFF; {{account}}&#x2AFF; {{checkNumber}}</div>
  </div></div>
</body>
</html>
