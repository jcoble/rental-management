# Rental Command — PRODUCTION stack for rc.coblesolutions.com
#
# Mirrors EdiPlatform's proven Hetzner prod setup (Traefik + Let's Encrypt ACME,
# HTTP→HTTPS redirect, security-headers + CSP middleware) BUT keeps Rental Command's
# same-origin, PATH-based routing — which is REQUIRED, because RC's auth uses httpOnly
# cookies first-party to the SvelteKit origin plus a same-origin /api/auth/refresh proxy.
# The API is NOT split onto a separate subdomain.
#
#   - https://${DOMAIN}/api/v1/*  and  /health   -> api  (priority 10)
#   - https://${DOMAIN}/*          (everything else)  -> web (priority 1, catch-all)
#     ^ includes the SvelteKit same-origin refresh proxy at /api/auth/refresh — which is exactly
#       why the api router matches /api/v1 and NOT a bare /api (a bare /api would steal that route).
#
# Both routers carry a Host(`${DOMAIN}`) rule so Traefik knows which cert to issue, and
# both use tls.certresolver=letsencrypt so the single ${DOMAIN} cert covers the whole app.
#
# Webhooks (Stripe /api/v1/payments/stripe, e-sign /api/v1/esign/webhook, SMS
# /api/v1/sms, signing links /sign/...) all live under the same host, so they Just Work
# through the /api prefix and the web catch-all — no extra routers needed.
#
# Deploys are CI-driven: GitHub Actions builds api/engine/web, pushes them to GHCR, and the
# box only PULLS — it never compiles (the box is small; building belongs in CI). See
# .github/workflows/deploy.yml. To ship: push a tag `vX.Y.Z` (or run the Deploy workflow).
#
# Manual fallback (on the box), e.g. to re-pull the last deployed tag:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env pull
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Migrations self-apply on boot (API + Engine both run EF Core migrations under a shared
# PostgreSQL advisory lock, so they never race).

services:
  # ── Reverse proxy / TLS terminator (Let's Encrypt ACME) ─────────────────────
  traefik:
    image: traefik:v3
    environment:
      - DOCKER_API_VERSION=1.44
    container_name: rentalcommand-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=rentalcommand-web"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP → HTTPS redirect.
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt via the TLS-ALPN-01 challenge (needs port 443 reachable).
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - web
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    labels:
      - "traefik.enable=true"
      # ── Security headers (applied to both routers) ───────────────────────────
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.permissionsPolicy=camera=(self), microphone=(self), geolocation=()"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-XSS-Protection=0"
      # ── CSP (applied to the web/HTML responses) ──────────────────────────────
      # Same-origin everything: connect-src 'self' covers the /api calls and the
      # /api/v1/hubs SignalR endpoint (wss: for the websocket transport). Stripe is the
      # only third party loaded in the browser (Checkout/Elements). The OpenAI/Anthropic
      # LLMs are called server-side only, so they are deliberately NOT in the CSP.
      # 'unsafe-inline'/'unsafe-eval' on script-src: SvelteKit's hydration + Stripe.js.
      # img/media data: + blob: cover camera/scan capture previews and inline PDFs.
      - "traefik.http.middlewares.csp.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.stripe.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss://${DOMAIN} https://api.stripe.com https://*.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rentalcommand-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rentalcommand_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-rentalcommand}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/var/lib/postgresql/backup
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentalcommand_app} -d ${POSTGRES_DB:-rentalcommand}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── REST API (also serves /health and the SignalR hubs under /api/v1/hubs) ──
  # Images are built in CI (GitHub Actions) and pulled from GHCR — never built on this box.
  # IMAGE_TAG (a git short-sha) is written to .env by the deploy workflow; falls back to :latest.
  api:
    image: ghcr.io/jcoble/rentalcommand-api:${IMAGE_TAG:-latest}
    container_name: rentalcommand-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-rentalcommand};Username=${POSTGRES_USER:-rentalcommand_app};Password=${POSTGRES_PASSWORD}
      # ── Auth / JWT ─────────────────────────────────────────────────────────
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - Jwt__Issuer=${JWT_ISSUER:-RentalCommand}
      - Jwt__Audience=${JWT_AUDIENCE:-RentalCommandWeb}
      # ── CORS + public URLs ─────────────────────────────────────────────────
      # Same-origin, so the only allowed origin is the app's own host.
      - Cors__AllowedOrigins__0=https://${DOMAIN}
      # Used to build /sign/{token} (e-sign) and password-reset/verify links in emails.
      - App__WebBaseUrl=${APP_WEB_BASE_URL:-https://${DOMAIN}}
      - App__TimeZone=${APP_TIMEZONE:-America/New_York}
      # Platform super-admin allowlist (Engine Health etc.). Empty = fail closed, nobody.
      # Single email expected; the API binds an array, so index 0 carries it.
      - PlatformAdmin__Emails__0=${PLATFORM_ADMIN_EMAILS:-}
      # ── Uploads (scan/document storage) + DataProtection keys (shared w/ engine) ──
      - Upload__BasePath=/var/lib/rentalcommand/uploads
      - DataProtection__KeysPath=/var/lib/rentalcommand/dataprotection-keys
      # ── LLM assistant (scan→draft, KB, daily briefing). Server-side only. ──
      - Assistant__Provider=${ASSISTANT_PROVIDER:-openai}
      - Assistant__ModelId=${ASSISTANT_MODEL_ID:-gpt-4o}
      - Assistant__ApiKey=${ASSISTANT_API_KEY:-}
      # ── Google Places (New) address autocomplete. Server-side only; the web app
      #    calls /api/v1/places/*. Leave unset to keep address fields manual-entry. ──
      - GooglePlaces__ApiKey=${GOOGLE_PLACES_API_KEY:-}
      # ── Stripe (online rent payments / autopay) ────────────────────────────
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      - Stripe__AllowedReturnHosts__0=${DOMAIN}
      # ── Google OAuth sign-in ───────────────────────────────────────────────
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      # ── E-sign: native (ESIGN/UETA) is the default. Set Esign__ApiKey only to swap
      #     to hosted Dropbox Sign. WebhookSecret verifies inbound Dropbox Sign events. ──
      - Esign__ApiKey=${ESIGN_API_KEY:-}
      - Esign__WebhookSecret=${ESIGN_WEBHOOK_SECRET:-}
      # ── SMS inbound-webhook signature: recompute against the public URL (behind proxy) ──
      - Notifications__PublicWebhookBaseUrl=${APP_WEB_BASE_URL:-https://${DOMAIN}}
      - Notifications__SignalWire__ProjectId=${SIGNALWIRE_PROJECT_ID:-}
      - Notifications__SignalWire__Token=${SIGNALWIRE_TOKEN:-}
      - Notifications__SignalWire__SpaceUrl=${SIGNALWIRE_SPACE_URL:-}
      - Notifications__SignalWire__FromNumber=${SIGNALWIRE_FROM_NUMBER:-}
      - Notifications__Twilio__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - Notifications__Twilio__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - Notifications__Twilio__FromNumber=${TWILIO_FROM_NUMBER:-}
      - Notifications__Telnyx__ApiKey=${TELNYX_API_KEY:-}
      - Notifications__Telnyx__FromNumber=${TELNYX_FROM_NUMBER:-}
      - Notifications__Vonage__ApiKey=${VONAGE_API_KEY:-}
      - Notifications__Vonage__ApiSecret=${VONAGE_API_SECRET:-}
      - Notifications__Vonage__FromNumber=${VONAGE_FROM_NUMBER:-}
    volumes:
      - uploads:/var/lib/rentalcommand/uploads
      - dataprotection_keys:/var/lib/rentalcommand/dataprotection-keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      # Route ONLY /api/v1/* (every .NET controller + webhooks + the SignalR hub live there) and
      # the /health probe to the API. Crucially NOT a bare /api prefix: the SvelteKit app owns the
      # same-origin refresh proxy at /api/auth/refresh, which must fall through to the web catch-all.
      # A bare PathPrefix(/api) here 404s that proxy -> the browser can't refresh -> users get logged out.
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api/v1`) || PathPrefix(`/health`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.middlewares=security-headers"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ── Background worker (outbox dispatch, rent charges, late fees, SMS/email,
  #     daily briefing, scan processing, autopay, lease autopilot). No HTTP port. ──
  engine:
    image: ghcr.io/jcoble/rentalcommand-engine:${IMAGE_TAG:-latest}
    container_name: rentalcommand-engine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-rentalcommand};Username=${POSTGRES_USER:-rentalcommand_app};Password=${POSTGRES_PASSWORD}
      - App__TimeZone=${APP_TIMEZONE:-America/New_York}
      # Shared with the API: scan processing reads the same upload store + DP keys.
      - Upload__BasePath=/var/lib/rentalcommand/uploads
      - DataProtection__KeysPath=/var/lib/rentalcommand/dataprotection-keys
      # ── LLM assistant (scan processing worker / daily briefing) ────────────
      - Assistant__Provider=${ASSISTANT_PROVIDER:-openai}
      - Assistant__ModelId=${ASSISTANT_MODEL_ID:-gpt-4o}
      - Assistant__ApiKey=${ASSISTANT_API_KEY:-}
      # ── Stripe (autopay charging from the engine) ──────────────────────────
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      # ── Notification automations (financial ones default OFF; opt-in) ──────
      - Notifications__NotifyTenants=${NOTIFY_TENANTS:-false}
      - Notifications__EnableRentCharges=${ENABLE_RENT_CHARGES:-false}
      - Notifications__EnableLateFees=${ENABLE_LATE_FEES:-false}
      - Notifications__EnableRecurringMaintenance=${ENABLE_RECURRING_MAINTENANCE:-true}
      # ── Email transport: SendGrid (default) OR Smtp (Zoho). Flip TRANSPORT=Smtp. ──
      - Notifications__Email__Transport=${EMAIL_TRANSPORT:-SendGrid}
      - Notifications__SendGrid__ApiKey=${SENDGRID_API_KEY:-}
      - Notifications__SendGrid__FromEmail=${SENDGRID_FROM_EMAIL:-}
      - Notifications__SendGrid__FromName=${SENDGRID_FROM_NAME:-Rental Command}
      - Notifications__Smtp__Host=${SMTP_HOST:-}
      - Notifications__Smtp__Port=${SMTP_PORT:-465}
      - Notifications__Smtp__UseSsl=${SMTP_USE_SSL:-true}
      - Notifications__Smtp__Username=${SMTP_USERNAME:-}
      - Notifications__Smtp__Password=${SMTP_PASSWORD:-}
      - Notifications__Smtp__FromEmail=${SMTP_FROM_EMAIL:-}
      - Notifications__Smtp__FromName=${SMTP_FROM_NAME:-Rental Command}
      # ── SMS platform-default fallback (per-portfolio BYO providers override this). ────
      #    Resolution order: SignalWire → Twilio → Telnyx → Vonage. A landlord who configures
      #    their own provider in Settings bypasses these entirely for their portfolio.
      - Notifications__SignalWire__ProjectId=${SIGNALWIRE_PROJECT_ID:-}
      - Notifications__SignalWire__Token=${SIGNALWIRE_TOKEN:-}
      - Notifications__SignalWire__SpaceUrl=${SIGNALWIRE_SPACE_URL:-}
      - Notifications__SignalWire__FromNumber=${SIGNALWIRE_FROM_NUMBER:-}
      - Notifications__Twilio__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - Notifications__Twilio__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - Notifications__Twilio__FromNumber=${TWILIO_FROM_NUMBER:-}
      - Notifications__Telnyx__ApiKey=${TELNYX_API_KEY:-}
      - Notifications__Telnyx__FromNumber=${TELNYX_FROM_NUMBER:-}
      - Notifications__Vonage__ApiKey=${VONAGE_API_KEY:-}
      - Notifications__Vonage__ApiSecret=${VONAGE_API_SECRET:-}
      - Notifications__Vonage__FromNumber=${VONAGE_FROM_NUMBER:-}
      # ── Push (FCM HTTP v1 via FirebaseAdmin). Fail-soft: unset = suppression logs. ──
      # Key file lives on the host at /opt/rental-command/secrets (bind-mounted below, ro).
      - Push__FirebaseProjectId=${PUSH_FIREBASE_PROJECT_ID:-}
      - Push__ServiceAccountJsonPath=${PUSH_SERVICE_ACCOUNT_JSON_PATH:-}
    volumes:
      - uploads:/var/lib/rentalcommand/uploads
      - dataprotection_keys:/var/lib/rentalcommand/dataprotection-keys
      - /opt/rental-command/secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # internal = reach Postgres; web = internet EGRESS (the `internal` net is internal:true, i.e.
      # no internet). The engine makes outbound calls to OpenAI (scan extraction), SendGrid, Twilio,
      # and SignalWire — all of which fail if it's on the internal-only net. Mirrors the API's homing.
      - web
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── SvelteKit frontend (adapter-node, :3000) ────────────────────────────────
  # Built in CI with VITE_API_URL=/api/v1 baked in (see .github/workflows/deploy.yml).
  web:
    image: ghcr.io/jcoble/rentalcommand-web:${IMAGE_TAG:-latest}
    container_name: rentalcommand-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ORIGIN must match the public scheme+host so SvelteKit accepts POST/form actions
      # and so the Google OAuth redirect URI ({origin}/auth/google/callback) is correct.
      - ORIGIN=https://${DOMAIN}
      # Platform super-admin allowlist (comma-separated, case-insensitive). Empty = nobody.
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
      # Server-side (SSR/load/auth) reaches the API container internally on the docker network.
      - API_URL=http://api:8080
      # Web needs the public client id at runtime to show the Google button + build the consent URL.
      - PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # NOTE: Google Places address autocomplete is served by the API (GooglePlaces__ApiKey on the
      # api service); the web app calls /api/v1/places/*. No Places key is needed on the web tier.
    depends_on:
      - api
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    labels:
      - "traefik.enable=true"
      # Catch-all (lowest priority): everything that is not /api or /health goes to web.
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.middlewares=security-headers,csp"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  # ── Static downloads (the Android APK for sideloading) ──────────────────────
  # Serves /opt/rental-command/downloads at https://${DOMAIN}/download/* (StripPrefix drops the
  # /download prefix before nginx). Router priority 5 sits ABOVE the web catch-all (1) but BELOW
  # the api router (10), so it never shadows /api/v1 or /health. Tiny read-only nginx.
  downloads:
    image: nginx:alpine
    container_name: rentalcommand-downloads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/rental-command/downloads:/usr/share/nginx/html:ro
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.downloads.rule=Host(`${DOMAIN}`) && PathPrefix(`/download`)"
      - "traefik.http.routers.downloads.entrypoints=websecure"
      - "traefik.http.routers.downloads.tls=true"
      - "traefik.http.routers.downloads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.downloads.priority=5"
      - "traefik.http.middlewares.downloads-strip.stripprefix.prefixes=/download"
      - "traefik.http.routers.downloads.middlewares=downloads-strip,security-headers"
      - "traefik.http.services.downloads.loadbalancer.server.port=80"

networks:
  web:
    name: rentalcommand-web
  internal:
    name: rentalcommand-internal
    internal: true

volumes:
  letsencrypt:
  postgres_data:
  postgres_backup:
  uploads:
  dataprotection_keys:
