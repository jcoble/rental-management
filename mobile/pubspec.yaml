name: rental_command
description: "Rental Command — property management for landlords."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  go_router: ^17.2.3
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  signalr_netcore: ^1.4.4
  record: ^7.0.0
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.0
  # Used by voice_command_controller for App-Actions deep links. Was pinned in
  # pubspec.lock as a direct dependency but missing from pubspec.yaml; declared
  # here so `flutter pub get` keeps it and the app compiles.
  app_links: ^7.1.1
  # Design system (EdiPlatform "M3 Expressive" port):
  # Funnel Display (display/headline) + Funnel Sans (body) fetched at runtime.
  google_fonts: ^8.1.0
  # Material Symbols Rounded — variable icon font with a FILL axis for the
  # outline→fill morph on active nav items.
  material_symbols_icons: ^4.2928.1
  google_sign_in: ^7.2.0
  # Release hygiene (P0-4): share a generated PDF out via the system share sheet
  # (replaces the broken launchUrl(Uri.file(...)) opens that Android 7+ rejects)
  # and pick a PDF/file for the Capture FAB.
  share_plus: ^10.1.4
  open_filex: ^4.7.0
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  # Client-side multi-photo -> single-PDF stitch for the scan front door (Lane A
  # frozen contract): each captured lease photo becomes one PDF page, uploaded via
  # the existing single-file /scans path (server already handles PDF). `image`
  # decodes/re-encodes each frame to a predictable JPEG; `pdf` lays out the pages.
  pdf: ^3.11.1
  image: ^4.3.0
  # Push notifications E2E (P0-2): FCM (Android) + APNs (iOS) via firebase_messaging,
  # surfaced as OS notifications by flutter_local_notifications when the app is
  # foregrounded. Placeholder-safe: Firebase.initializeApp fails soft when no
  # google-services.json / GoogleService-Info.plist is present (see push_service).
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # EdiPlatform surface-art patterns for hero/header art overlays (§7.1/§7.7).
    - assets/patterns/
